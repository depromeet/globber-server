# Install into /etc/nginx/sites-available/globber after the migration checklist.
# This file belongs inside the nginx http context.
upstream globber_backend {
    server 127.0.0.1:8080;
}

upstream globber_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name globber.world www.globber.world;

    # Use the same webroot when configuring host Certbot renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name globber.world www.globber.world;

    ssl_certificate /etc/letsencrypt/live/globber.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globber.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Match the current NPM upload limit and inherited upstream timeouts.
    client_max_body_size 2000m;
    proxy_http_version 1.1;
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        # Preserve the existing public /api prefix stripping behavior.
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://globber_backend;
    }

    location /login/oauth2/ {
        proxy_pass http://globber_backend;
    }

    location /api/places {
        proxy_pass http://globber_frontend;
    }

    location /api/geocode {
        proxy_pass http://globber_frontend;
    }

    location / {
        add_header X-Served-By $host;
        proxy_pass http://globber_frontend;
    }
}
