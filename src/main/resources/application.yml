spring:
  application:
    name: globber
  profiles:
    active: local

management:
  endpoints:
    # 프로필 설정이 노출 목록을 덮어써도 health 외 엔드포인트는 비활성화되어 열리지 않게 한다.
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never

---
spring:
  config:
    activate:
      on-profile: prod

# 운영 CORS 허용 Origin(GLB-141). www도 운영 화면이 쓰므로 함께 허용한다.
app:
  cors:
    allowed-origins: https://globber.world,https://www.globber.world
